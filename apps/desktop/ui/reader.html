<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>和她聊聊</title><link rel="stylesheet" href="/reader.css"><link rel="stylesheet" href="/questions.css"></head><body><header><img src="/character-icon.png" width="40" height="40" alt="她"><div><h1>和她聊聊</h1><p id="reader-status" role="status">文字留在这里，慢慢看。</p></div><button id="reader-stop-voice" type="button">停止说话</button><button id="reader-new" type="button">新对话</button><button id="reader-stop" type="button" disabled>停止生成 / 任务</button></header><section class="drawer-toolbar"><label for="reader-drawer">当前事务</label><select id="reader-drawer"></select><button id="reader-drawer-new" type="button">新抽屉</button><details><summary>关联其他抽屉（本次范围）</summary><div id="reader-linked"></div><button id="reader-linked-save" type="button">应用关联</button></details><p id="reader-memory-status" role="status"></p></section><dialog id="reader-drawer-dialog"><form id="reader-drawer-form"><label for="reader-drawer-name">抽屉名称</label><input id="reader-drawer-name" maxlength="80" required><button type="submit">创建并切换</button><button id="reader-drawer-cancel" type="button">取消</button><p id="reader-drawer-error" role="alert"></p></form></dialog><section id="reader-questions" aria-label="她的追问" hidden></section><main id="reader-history" aria-label="对话正文"></main><button id="reader-latest" type="button" hidden>回到最新</button><footer><div class="selection-row"><button id="reader-explain" type="button" disabled>解释这一段</button><span id="reader-selection"></span></div><form id="reader-form"><label class="sr-only" for="reader-input">写给她</label><textarea id="reader-input" maxlength="4000" placeholder="写给她，或在倾听结束后确认识别文字…"></textarea><div class="input-row"><span>Enter 发送 · Shift+Enter 换行</span><button id="reader-send" type="submit">发送</button></div><p id="reader-error" role="alert"></p></form></footer><script src="/safe-markdown.js"></script><script src="/reader.js"></script><script src="/questions.js"></script><script src="/memory-reader.js"></script></body></html>
